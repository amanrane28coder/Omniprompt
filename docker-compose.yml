services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: omniprompt
      POSTGRES_PASSWORD: omniprompt
      POSTGRES_DB: omniprompt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg2://omniprompt:omniprompt@db:5432/omniprompt
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  pgdata:
